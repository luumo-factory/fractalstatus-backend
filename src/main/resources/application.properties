spring.application.name=fractalstatus

# Include non-view-annotated properties when a @JsonView is active, so nested
# config/runtime fields serialize once their parent field is in-view. Top-level
# config/runtime/structure gating is handled by explicit @JsonView annotations.
spring.jackson.mapper.default-view-inclusion=true

# Expose actuator health/info by default.
# (Jackson 3 serializes java.time types as ISO-8601 by default.)
management.endpoints.web.exposure.include=health,info

# NOTE: whole-application configuration (server.port, fractalstatus.config-path,
# auto-start, log.capacity, cors.allowed-origins) is loaded from the JSON file
# fractalstatus.json (bundled default on the classpath; override with a
# ./fractalstatus.json next to the app, or -Dfractalstatus.config-file=...).
# See JsonConfigEnvironmentPostProcessor. Values here/in code act as fallbacks.
